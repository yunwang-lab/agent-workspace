<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#392517">
  <meta name="robots" content="noindex, nofollow">
  <title>Agent 协作台 · Yunwang Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #493021;
      color: #151515;
      font: 1rem/1.55 system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 51% center;
      pointer-events: none;
    }
    main {
      position: relative;
      display: grid;
      align-items: end;
      justify-items: start;
      min-height: 100vh;
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) max(4vw, env(safe-area-inset-right))
        max(6vh, calc(env(safe-area-inset-bottom) + 18px)) max(4vw, env(safe-area-inset-left));
    }
    .entry {
      width: min(100%, clamp(23rem, 32vw, 32rem));
      padding: clamp(1.45rem, 2.55vw, 2.5rem);
      border: 1px solid rgb(255 255 255 / 72%);
      border-radius: clamp(1.4rem, 2.1vw, 2rem);
      background: linear-gradient(145deg, rgb(255 255 255 / 75%), rgb(251 245 239 / 57%));
      -webkit-backdrop-filter: blur(22px) saturate(118%);
      backdrop-filter: blur(22px) saturate(118%);
      box-shadow: inset 0 1px 1px rgb(255 255 255 / 78%),
        inset 0 -1px 2px rgb(255 255 255 / 42%), 0 14px 40px rgb(42 23 12 / 22%);
    }
    .lab { margin: 0 0 0.65rem; color: #292525; font-size: 0.9rem; font-weight: 620; }
    h1 { margin: 0 0 0.65rem; font-size: clamp(2rem, 3.05vw, 3rem); line-height: 1.16; letter-spacing: -0.035em; }
    .description { margin: 0 0 1.25rem; color: #242020; font-size: clamp(0.95rem, 1.35vw, 1.25rem); }
    .launch {
      display: inline-flex;
      align-items: center;
      gap: 0.65em;
      min-height: 3rem;
      padding: 0.5em 1.2em;
      border: 1px solid rgb(255 255 255 / 93%);
      border-radius: 999px;
      background: linear-gradient(#fff, #fffffff0);
      box-shadow: inset 0 1px 2px #fff, 0 3px 12px rgb(45 27 12 / 11%);
      color: #171717;
      font-size: clamp(1rem, 1.3vw, 1.2rem);
      font-weight: 700;
      text-decoration: none;
    }
    .launch:hover { background: #fff; box-shadow: inset 0 1px 2px #fff, 0 4px 16px rgb(45 27 12 / 22%); }
    .launch:active { background: #f2efeb; }
    .launch:focus-visible { outline: 3px solid #352a25; outline-offset: 4px; }
    .connection-help {
      margin-top: 1.1rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgb(38 27 21 / 16%);
      color: #292320;
      font-size: .93rem;
    }
    .connection-help summary {
      cursor: pointer;
      width: fit-content;
      font-weight: 650;
    }
    .connection-help p { margin: .6rem 0 .8rem; max-width: 31ch; }
    .retry {
      display: inline-flex;
      padding: .3rem .75rem;
      border: 1px solid rgb(38 27 21 / 24%);
      border-radius: 999px;
      color: #251f1b;
      background: rgb(255 255 255 / 44%);
      font-weight: 650;
      text-decoration: none;
    }
    .retry:hover { background: rgb(255 255 255 / 75%); }
    @media (max-width: 640px) {
      main { padding-inline: max(1rem, env(safe-area-inset-left)) max(1rem, env(safe-area-inset-right)); }
      .entry { width: min(100%, 25rem); }
      .description { margin-bottom: 1rem; }
    }
    @media (prefers-reduced-transparency: reduce) {
      .entry { background: #faf6f2; -webkit-backdrop-filter: none; backdrop-filter: none; }
    }
  </style>
</head>
<body>
  <img class="backdrop" src="./studio-hero.jpg" alt="" fetchpriority="high">
  <main>
    <section class="entry" aria-labelledby="entry-title">
      <p class="lab">Yunwang Lab</p>
      <h1 id="entry-title">Agent 协作台</h1>
      <p class="description">从已安装协作台的 Mac 打开，即可进入聊天和实时纸面大屏。新版支持在聊天里打开 Codex 生成的文件、复制和朗读单条回复，并按文件类型筛选搜索结果。</p>
      <a class="launch" href="http://127.0.0.1:4173/studio" target="_blank" rel="noopener noreferrer">打开本机协作台 <span aria-hidden="true">↗</span></a>
      <details class="connection-help">
        <summary>打不开？</summary>
        <p>请在已安装协作台的 Mac 上打开。若已在这台 Mac 上，重新启动协作台服务后再试一次。</p>
        <a class="retry" href="http://127.0.0.1:4173/studio" target="_blank" rel="noopener noreferrer">重试 <span aria-hidden="true">↗</span></a>
      </details>
    </section>
  </main>
</body>
</html>
