<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Agent 协作台 · Yunwang Lab</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; align-items: center; background: #181818; color: #f1f0ee; font: 1rem/1.65 Inter, system-ui, -apple-system, sans-serif; }
    main { width: min(100% - 2rem, 34rem); margin: 2rem auto; padding: clamp(1.4rem, 5vw, 3rem); border: 1px solid #454545; border-radius: 20px; background: #242424; }
    .lab { margin: 0 0 0.65rem; color: #bcbcbf; font-size: 0.875rem; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 7vw, 2.6rem); line-height: 1.2; }
    .description { margin: 0 0 1.65rem; color: #d0d0d4; }
    a { display: inline-flex; align-items: center; gap: 0.55em; min-height: 2.75rem; padding: 0.5em 1.05em; border-radius: 9px; background: #2965cb; color: #fff; font-weight: 650; text-decoration: none; }
    a:hover { background: #245bb8; }
    a:focus-visible { outline: 2px solid #b4d0ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="lab">Yunwang Lab</p>
    <h1>Agent 协作台</h1>
    <p class="description">从已安装协作台的 Mac 打开，即可进入聊天和实时纸面大屏。</p>
    <a href="http://127.0.0.1:4173/studio" rel="noreferrer">打开本机协作台 <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
